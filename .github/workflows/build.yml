name: Build

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
      - 'V*'
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore PrinterManagerNativeTool.sln

      - name: Build
        run: dotnet build PrinterManagerNativeTool.sln -c Release --no-restore

      - name: Publish portable x64
        run: dotnet publish PrinterManagerNativeTool/PrinterManagerNativeTool.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true --no-restore -o artifacts/win-x64

      - name: Upload portable executable
        uses: actions/upload-artifact@v4
        with:
          name: PrinterManager-win-x64
          path: artifacts/win-x64/PrinterManagerNativeTool.exe
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/V')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/win-x64/PrinterManagerNativeTool.exe
          generate_release_notes: true
